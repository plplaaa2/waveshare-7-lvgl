display:
  - platform: rpi_dpi_rgb
    id: my_display    
    model: ESP32-8048S070
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
i2c:
  scl: GPIO20
  sda: GPIO19
  scan: True

# 터치 스크린 설정
touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  reset_pin: GPIO38  # <--- 리셋 핀 추가
  transform:
    mirror_x: false
    mirror_y: false
  on_touch:
    - lambda: |-
        if (!id(backlight).remote_values.is_on()) {
        id(light_up).execute();
        }
    
light:
  - platform: monochromatic 
    output: backlight_pwm
    id: backlight
    name: "${name} Back Light"
    restore_mode: RESTORE_AND_ON
    on_turn_on: 
      then:
        - script.execute: light_up
        - lvgl.resume:
    on_turn_off: 
      then:
        - lvgl.pause:

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO2
    frequency: 1220
    min_power: 0.3
    zero_means_zero: True        

switch:
  - platform: lvgl
    widget: switch_auto_bright
    id: auto_brightness    
    name: "Auto Brightness"
    icon: mdi:brightness-auto
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: light_up
    turn_off_action:
      - script.execute: light_up
      
script:    
  - id: light_up
    then:
      - if:
          condition:
            and:
              - switch.is_off: auto_brightness              
          then:
            - light.turn_on: 
                id: backlight
                brightness: !lambda return id(backlight_brightness).state / 100;
          else:
            - light.turn_on:
                id: backlight
                brightness: !lambda |-
                  if (id(lux_sensor).state >= 500) {
                    return 1.0;
                  }
                  else if (id(lux_sensor).state >= 300) {
                    return 0.7;
                  }
                  else if (id(lux_sensor).state >= 100) {
                    return 0.5;
                  }
                  else {
                    return 0.3;
                  }
