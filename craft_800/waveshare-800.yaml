display:
  - platform: mipi_rgb
    id: my_display
    model: ESP32-S3-TOUCH-LCD-7-800X480
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB

ch422g:
  id: ch422g_hub

touchscreen:
  platform: gt911
  id: my_touchscreen
  interrupt_pin: GPIO4
  reset_pin: 
    ch422g: ch422g_hub
    number: 1
  on_touch:
    - lambda: |-
        if (!id(backlight).remote_values.is_on()) {
        id(light_up).execute();
        }

i2c:
  scl: GPIO9
  sda: GPIO8
  scan: True
    
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "${name} Back Light"
    restore_mode: RESTORE_AND_ON
    on_turn_on: 
      then:
        - script.execute: light_up
        - lvgl.resume:
    on_turn_off: 
      then:
        - lvgl.pause:

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO6
    frequency: 1000Hz
    min_power: 0.3
    zero_means_zero: True    

switch:
  - platform: template
    id: auto_brightness
    name: ${name} Auto Brightness
    icon: mdi:brightness-auto
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lvgl.widget.update:
          id: switch_auto_bright
          state:
            checked: true
    turn_off_action:
      - lvgl.widget.update:
          id: switch_auto_bright
          state:
            checked: false

script:    
  - id: light_up
    then:
      - if:
          condition:
            and:
              - switch.is_off: auto_brightness              
          then:
            - light.turn_on: 
                id: backlight
                brightness: !lambda return id(backlight_brightness).state / 100;
          else:
            - light.turn_on:
                id: backlight
                brightness: !lambda |-
                  if (id(lux_sensor).state >= 500) {
                    return 1.0;
                  }
                  else if (id(lux_sensor).state >= 300) {
                    return 0.7;
                  }
                  else if (id(lux_sensor).state >= 100) {
                    return 0.5;
                  }
                  else {
                    return 0.3;
                  }
